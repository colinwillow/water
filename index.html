<script>
// Crash trap: FIRST thing in the head. A phone has no console, so an exception is a blank screen.
(function () {
	function show(msg) {
		var el = document.getElementById('crash');
		if (!el) { el = document.createElement('pre'); el.id = 'crash'; (document.body || document.documentElement).appendChild(el); }
		el.textContent += msg + '\n';
		el.style.display = 'block';
	}
	window.__crash = show;
	window.addEventListener('error', function (e) {
		if (e.target && e.target !== window && (e.target.src || e.target.href)) show('LOAD FAIL ' + (e.target.src || e.target.href));
		else show((e.message || 'error') + ' @' + (e.lineno || '?'));
	}, true);
	window.addEventListener('unhandledrejection', function (e) { show('REJECT ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
})();
</script>
<script>
// Double-tap and pinch refused at the touch stream: iOS ignores user-scalable=no.
(function () {
	var lt = 0, lx = 0, ly = 0;
	document.addEventListener('touchend', function (e) {
		var t = e.changedTouches[0], now = Date.now();
		if (now - lt < 400 && Math.abs(t.clientX - lx) < 40 && Math.abs(t.clientY - ly) < 40 && !e.target.closest('button')) e.preventDefault();
		lt = now; lx = t.clientX; ly = t.clientY;
	}, { passive: false });
	['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) {
		document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false, capture: true });
	});
})();

<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from './vendor/BufferGeometryUtils.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const BUILD = 2;
const bnEl = document.getElementById('bn');
bnEl.textContent = 'w' + BUILD; bnEl.classList.add('pulse');

// ---------------------------------------------------------------------------------------------
// Tunables. Everything worth arguing about is here and on window.water for the console.
// ---------------------------------------------------------------------------------------------
const WATER = {
	abs: new THREE.Vector3(0.30, 0.075, 0.058),   // absorption per metre (r, g, b): red dies first -> turquoise
	scat: new THREE.Vector3(0.010, 0.085, 0.24),  // in-scattered colour of a deep water column (linear)
	caustics: 0.75,                               // strength of the caustic light on the seabed
	wind: 1.0,                                    // surface normal strength
	waves: [                                      // [dirX, dirZ, amplitude m, wavelength m] -- summed sines
		[1.0, 0.25, 0.085, 11.0],
		[0.55, 0.85, 0.055, 6.3],
		[-0.35, 0.95, 0.030, 3.7],
		[0.9, -0.45, 0.018, 2.3],
	],
	ripLife: 4.5,                                 // seconds a ripple lives
	ripSpeed: 1.55,                               // m/s a ring expands at (sets the wake's V angle)
	fog: 0.0011,                                  // exp fog density per metre
};
const SEA = {
	calm:   { wind: 0.55, amp: 0.45 },
	breezy: { wind: 1.0,  amp: 1.0 },
	choppy: { wind: 1.55, amp: 2.0 },
};
const TIMES = {
	day:    { el: 52, az: 25,  sun: [1.00, 0.96, 0.90], int: 3.2, zen: [0.16, 0.38, 0.78], hor: [0.66, 0.80, 0.92], hemi: 1.25 },
	golden: { el: 14, az: 230, sun: [1.00, 0.80, 0.55], int: 2.8, zen: [0.24, 0.44, 0.74], hor: [0.98, 0.84, 0.66], hemi: 0.95 },
	sunset: { el: 4,  az: 245, sun: [1.00, 0.55, 0.30], int: 2.0, zen: [0.16, 0.24, 0.50], hor: [1.00, 0.66, 0.46], hemi: 0.6 },
};

// ---------------------------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const DPR_MAX = Math.min(window.devicePixelRatio || 1, 2);
let dpr = DPR_MAX;
renderer.setPixelRatio(dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;   // ACES desaturates the turquoise; Neutral keeps it
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 3000);

// ---------------------------------------------------------------------------------------------
// Baked textures. All procedural, all tileable, all RGBA8 -- nothing here needs float textures,
// which is what keeps it safe on iOS.
// ---------------------------------------------------------------------------------------------
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// periodic value noise, period P lattice cells over [0,1)
function makePeriodicNoise(P, seed) {
	const r = rng(seed), g = new Float32Array(P * P);
	for (let i = 0; i < g.length; i++) g[i] = r();
	return (u, v) => {
		const x = u * P, y = v * P, xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
		const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
		const at = (i, j) => g[((j % P + P) % P) * P + ((i % P + P) % P)];
		const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
		return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
	};
}

// R: caustic cells (bright thin lines at the Voronoi edges), G/B: fbm for clouds and foam
function bakeNoise(N = 256) {
	const data = new Uint8Array(N * N * 4);
	const C = 7, r = rng(7), pts = [];
	for (let j = 0; j < C; j++) for (let i = 0; i < C; i++) pts.push([(i + 0.15 + 0.7 * r()) / C, (j + 0.15 + 0.7 * r()) / C]);
	const n1 = [4, 8, 16, 32].map((p, k) => makePeriodicNoise(p, 11 + k));
	const n2 = [3, 6, 12, 24].map((p, k) => makePeriodicNoise(p, 51 + k));
	for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
		const u = x / N, v = y / N;
		let f1 = 9, f2 = 9;
		const ci = Math.floor(u * C), cj = Math.floor(v * C);
		for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
			const ii = ci + di, jj = cj + dj;
			const p = pts[((jj % C + C) % C) * C + ((ii % C + C) % C)];
			const px = p[0] + Math.floor(ii / C), py = p[1] + Math.floor(jj / C);
			const d = Math.hypot(u - px, v - py);
			if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
		}
		const edge = (f2 - f1) * C;                          // 0 on the cell border
		const caus = Math.exp(-edge * 7.0);
		let a = 0, b = 0, w = 0.5, ww = 0;
		for (let k = 0; k < 4; k++) { a += n1[k](u, v) * w; b += n2[k](u, v) * w; ww += w; w *= 0.5; }
		const o = (y * N + x) * 4;
		data[o] = Math.round(caus * 255); data[o + 1] = Math.round(a / ww * 255); data[o + 2] = Math.round(b / ww * 255); data[o + 3] = 255;
	}
	const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
	t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
	t.generateMipmaps = true; t.needsUpdate = true;
	return t;
}

// water surface slopes: a sum of sines whose wave vectors are INTEGER cycles per tile, so it tiles.
// Stores dh/dx, dh/dy in RG around 0.5.
function bakeNormals(N = 256) {
	const r = rng(3), W = [];
	for (let i = 0; i < 28; i++) {
		let kx, ky; do { kx = Math.round((r() * 2 - 1) * 9); ky = Math.round((r() * 2 - 1) * 9); } while (kx * kx + ky * ky < 4);
		const k = Math.hypot(kx, ky);
		W.push([kx, ky, 1 / Math.pow(k, 1.6), r() * Math.PI * 2]);
	}
	const gx = new Float32Array(N * N), gy = new Float32Array(N * N);
	let m = 0;
	for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
		const u = x / N, v = y / N; let dx = 0, dy = 0;
		for (const [kx, ky, a, ph] of W) { const c = Math.cos(2 * Math.PI * (kx * u + ky * v) + ph) * a * 2 * Math.PI; dx += c * kx; dy += c * ky; }
		gx[y * N + x] = dx; gy[y * N + x] = dy; m = Math.max(m, Math.abs(dx), Math.abs(dy));
	}
	const data = new Uint8Array(N * N * 4);
	for (let i = 0; i < N * N; i++) {
		data[i * 4] = Math.round((gx[i] / m * 0.5 + 0.5) * 255);
		data[i * 4 + 1] = Math.round((gy[i] / m * 0.5 + 0.5) * 255);
		data[i * 4 + 2] = 255; data[i * 4 + 3] = 255;
	}
	const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
	t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
	t.generateMipmaps = true; t.needsUpdate = true;
	return t;
}

const noiseTex = bakeNoise();
const normTex = bakeNormals();

// ---------------------------------------------------------------------------------------------
// The island: one height function, used by the terrain mesh, the props and the water's shore foam.
// ---------------------------------------------------------------------------------------------
const vn = makePeriodicNoise(64, 99);
const fbm = (x, z) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += (vn(x * f / 64, z * f / 64) - 0.5) * a; a *= 0.5; f *= 2.03; } return s; };
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const islandR = (a) => 12.5 + 2.0 * Math.sin(a * 2 + 0.7) + 1.2 * Math.sin(a * 3 + 2.1) + 0.7 * Math.sin(a * 5 + 0.4);

function height(x, z) {
	const r = Math.hypot(x, z), a = Math.atan2(z, x), d = r / islandR(a);
	const top = 0.75 + 0.35 * (1 - Math.min(1, d * d)) + 0.06 * fbm(x * 0.3, z * 0.3);
	let h = top;
	h = mix(h, -0.45, smooth(0.62, 1.02, d));        // the beach
	h = mix(h, -3.0, smooth(1.0, 2.5, d) * 0.92 + smooth(1.0, 1.3, d) * 0.08);
	h = mix(h, -15.0, smooth(2.3, 4.6, d));          // the drop-off into blue water
	h = mix(h, -26.0, smooth(4.6, 12.0, d));
	const under = smooth(0.95, 1.3, d);
	h += under * (fbm(x * 1.6, z * 1.6) * 1.0 + Math.sin(x * 1.7 + z * 0.6 + fbm(x * 4, z * 4) * 3) * 0.025);   // sand ripples
	return h;
}

// height texture for the water shader: +-64 m, height mapped [-8, 8] into a byte
const HT = { size: 128, n: 256, lo: -8, hi: 8 };
function bakeHeight() {
	const { size, n, lo, hi } = HT, data = new Uint8Array(n * n * 4);
	for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
		const x = (i + 0.5) / n * size - size / 2, z = (j + 0.5) / n * size - size / 2;
		const v = Math.round(Math.min(1, Math.max(0, (height(x, z) - lo) / (hi - lo))) * 255);
		const o = (j * n + i) * 4; data[o] = v; data[o + 1] = v; data[o + 2] = v; data[o + 3] = 255;
	}
	const t = new THREE.DataTexture(data, n, n, THREE.RGBAFormat);
	t.magFilter = t.minFilter = THREE.LinearFilter; t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; t.needsUpdate = true;
	return t;
}
const heightTex = bakeHeight();

// ---------------------------------------------------------------------------------------------
// Shared uniforms and GLSL. Sky, fog and water read the SAME numbers so the horizon cannot seam.
// ---------------------------------------------------------------------------------------------
const U = {
	uTime: { value: 0 },
	uSunDir: { value: new THREE.Vector3(0, 1, 0) },
	uSunCol: { value: new THREE.Vector3(1, 1, 1) },
	uZenith: { value: new THREE.Vector3() },
	uHorizon: { value: new THREE.Vector3() },
	uFogD: { value: WATER.fog },
	uNoise: { value: noiseTex },
	uAbs: { value: WATER.abs },
	uScat: { value: new THREE.Vector3() },
	uCaus: { value: WATER.caustics },
};

const GLSL_COMMON = /* glsl */`
uniform float uTime; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uZenith; uniform vec3 uHorizon;
uniform float uFogD; uniform sampler2D uNoise;
vec3 skyCol(vec3 d) {
	float y = max(d.y, 0.0);
	vec3 c = mix(uHorizon, uZenith, pow(y, 0.5));
	float s = max(dot(d, uSunDir), 0.0);
	c += uSunCol * (pow(s, 6.0) * 0.22 + pow(s, 60.0) * 0.55);
	return c;
}
float cloudAmt(vec3 d) {
	if (d.y <= 0.0) return 0.0;
	vec2 p = d.xz / (d.y + 0.08) * 0.11 + uTime * vec2(0.0016, 0.0009);
	float n = texture(uNoise, p).g * 0.62 + texture(uNoise, p * 2.9 + 0.31).b * 0.38;
	return smoothstep(0.50, 0.74, n) * smoothstep(0.0, 0.18, d.y);
}
vec3 skyFull(vec3 d) {
	vec3 c = skyCol(d);
	float cl = cloudAmt(d);
	float s = max(dot(d, uSunDir), 0.0);
	vec3 cc = mix(uHorizon * 0.85 + uZenith * 0.25, vec3(1.0) * (0.6 + 0.5 * uSunCol), 0.55) + uSunCol * pow(s, 10.0) * 0.6;
	return mix(c, cc, cl * 0.92);
}
vec3 fogTo(vec3 c, vec3 P) {
	vec3 v = P - cameraPosition; float dist = length(v);
	vec3 dir = v / max(dist, 1e-4);
	vec3 fc = skyCol(normalize(vec3(dir.x, 0.0, dir.z) + vec3(0.0, 1e-4, 0.0)));
	return mix(c, fc, 1.0 - exp(-dist * uFogD));
}
`;

// Every opaque thing in the world goes through this: underwater it gets caustics, the light path
// down through the water, and the view path back up -- so the colour of shallow water is the sand
// seen through it, not a tint painted on a plane. That is the whole Cala Blanca look.
function waterPatch(mat) {
	mat.onBeforeCompile = (sh) => {
		Object.assign(sh.uniforms, U);
		sh.vertexShader = sh.vertexShader
			.replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
			.replace('#include <project_vertex>', '#include <project_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
		sh.fragmentShader = sh.fragmentShader
			.replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nuniform vec3 uAbs; uniform vec3 uScat; uniform float uCaus;\n' + GLSL_COMMON)
			.replace('#include <opaque_fragment>', /* glsl */`#include <opaque_fragment>
			{
				vec3 P = vWPos; float depth = -P.y;
				vec3 col = gl_FragColor.rgb;
				if (depth > 0.0) {
					vec2 cuv = (P.xz + uSunDir.xz / max(uSunDir.y, 0.15) * depth) * 0.085;
					float c1 = texture(uNoise, cuv + uTime * vec2(0.019, 0.011)).r;
					float c2 = texture(uNoise, cuv * 1.37 + vec2(0.37, 0.11) - uTime * vec2(0.014, 0.022)).r;
					float caus = min(c1, c2); caus = caus * caus * 4.0;
					float cm = smoothstep(0.0, 0.35, depth) * exp(-depth * 0.11) * max(uSunDir.y, 0.0);
					col += diffuseColor.rgb * uSunCol * caus * cm * uCaus;
					col *= exp(-uAbs * depth * 0.7);
					vec3 toC = cameraPosition - P;
					float len = length(toC), up = cameraPosition.y - P.y;
					float L = up > 0.01 ? len * clamp(depth / up, 0.0, 1.0) : len;
					vec3 T = exp(-uAbs * L);
					col = col * T + uScat * (1.0 - T);
				}
				gl_FragColor.rgb = fogTo(col, P);
			}`);
	};
	mat.customProgramCacheKey = () => 'waterPatch';
	return mat;
}

// ---------------------------------------------------------------------------------------------
// Sky dome
// ---------------------------------------------------------------------------------------------
const sky = new THREE.Mesh(
	new THREE.SphereGeometry(2500, 32, 16),
	new THREE.ShaderMaterial({
		uniforms: U, side: THREE.BackSide, depthWrite: false, fog: false,
		vertexShader: `varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
		fragmentShader: GLSL_COMMON + `varying vec3 vDir;
		void main(){
			vec3 d = normalize(vDir);
			vec3 c = skyFull(d);
			float s = max(dot(d, uSunDir), 0.0);
			c += uSunCol * smoothstep(0.99955, 0.99975, s) * 14.0 * (1.0 - cloudAmt(d));
			if (d.y < 0.0) c = skyCol(vec3(d.x, 0.0, d.z) + vec3(0.0, 1e-4, 0.0));
			gl_FragColor = vec4(c, 1.0);
			#include <tonemapping_fragment>
			#include <colorspace_fragment>
		}`,
	}),
);
sky.renderOrder = -1; sky.frustumCulled = false;
scene.add(sky);

// ---------------------------------------------------------------------------------------------
// Polar grid: dense where the island is, sparse at the horizon. One layout for seabed and water.
// ---------------------------------------------------------------------------------------------
function polarGrid(rings, segs, rMax, pow) {
	const pos = [], idx = [];
	pos.push(0, 0, 0);
	for (let i = 1; i <= rings; i++) {
		const r = rMax * Math.pow(i / rings, pow);
		for (let j = 0; j < segs; j++) { const a = j / segs * Math.PI * 2; pos.push(Math.cos(a) * r, 0, Math.sin(a) * r); }
	}
	for (let j = 0; j < segs; j++) idx.push(0, 1 + (j + 1) % segs, 1 + j);
	for (let i = 1; i < rings; i++) {

// Water surface. Alpha-blended over the seabed: the seabed already carries the colour of the water

// ---------------------------------------------------------------------------------------------
const RIP_N = 32;
const ripples = Array.from({ length: RIP_N }, () => new THREE.Vector4(0, 0, -99, 0));

	uRip: { value: ripples }, uWind: { value: WATER.wind }, uAmp: { value: 1 },
	uWaves: { value: WATER.waves.map(w => new THREE.Vector4(...w)) },
	uRipLife: { value: WATER.ripLife }, uRipSpeed: { value: WATER.ripSpeed },
	uHT: { value: new THREE.Vector4(HT.size, HT.lo, HT.hi, 0) },

uniform vec4 uWaves[4]; uniform float uAmp;
vec3 waveAt(vec2 p, float t) {   // height and its gradient. waveHeight() in JS is the same sum
	float h = 0.0; vec2 g = vec2(0.0);
	for (int i = 0; i < 4; i++) {
		vec2 D = normalize(uWaves[i].xy); float A = uWaves[i].z * uAmp; float k = 6.2831853 / uWaves[i].w;
		float w = sqrt(9.8 * k); float ph = k * dot(D, p) - w * t;
		h += A * sin(ph); g += A * k * cos(ph) * D;

		void main() {
			vec3 p = (modelMatrix * vec4(position, 1.0)).xyz;
			vec3 w = waveAt(p.xz, uTime);
			float fade = 1.0 - smoothstep(150.0, 600.0, length(p.xz - cameraPosition.xz));
			p.y += w.x * fade; vG = w.yz * fade; vW = p;
			gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
		}`,
	fragmentShader: GLSL_COMMON + /* glsl */`

		varying vec3 vW; varying vec2 vG;
		void main() {

			float far = smoothstep(40.0, 420.0, dist);
			vec2 d1 = texture(uNrm, p * 0.041 + uTime * vec2(0.011, 0.007)).rg * 2.0 - 1.0;
			vec2 d2 = texture(uNrm, p * 0.113 + uTime * vec2(-0.009, 0.016)).rg * 2.0 - 1.0;
			vec2 d3 = texture(uNrm, p * 0.29 + uTime * vec2(0.021, -0.013)).rg * 2.0 - 1.0;
			vec2 g = vG + (d1 * 0.16 + d2 * 0.12 + d3 * 0.07 * (1.0 - far)) * uWind * (1.0 - far * 0.65);

			// ripples and wake: rings expanding from a list of sources. Normals AND a foam crest.
			float rfoam = 0.0;
			for (int i = 0; i < ${RIP_N}; i++) {
				vec4 r = uRip[i];
				float age = uTime - r.z;
				if (age < 0.0 || age > uRipLife) continue;

				float rad = age * uRipSpeed + 0.15; float x = dd - rad;
				if (abs(x) > 2.2) continue;

				float ph = x * 6.0 - age * 2.0;

				rfoam += env * smoothstep(0.75, 1.0, sin(ph)) * smoothstep(1.2, 0.1, age) * 0.4;
			}
			vec3 n = normalize(vec3(-g.x, 1.0, -g.y));

			float ndv = max(dot(n, V), 0.0);
			float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);
			vec3 R = reflect(-V, n); R.y = abs(R.y);
			vec3 refl = skyFull(R);
			vec3 H = normalize(uSunDir + V); float nh = max(dot(n, H), 0.0);
			vec3 spec = uSunCol * (pow(nh, 900.0) * 60.0 + pow(nh, 120.0) * 0.6) * smoothstep(0.0, 0.08, uSunDir.y);

			// shore foam: the depth comes from the baked height map
			vec2 huv = p / uHT.x + 0.5;
			float hgt = mix(uHT.y, uHT.z, texture(uHgt, huv).r);
			float inMap = step(abs(huv.x - 0.5), 0.5) * step(abs(huv.y - 0.5), 0.5);
			float dep = mix(30.0, -hgt + vW.y, inMap);
			float fn = texture(uNoise, p * 0.21 + uTime * vec2(0.013, 0.009)).g;
			float fn2 = texture(uNoise, p * 0.63 - uTime * vec2(0.02, 0.011)).b;
			float band = sin(dep * 9.0 - uTime * 1.6 + fn * 6.0) * 0.5 + 0.5;
			float shore = 1.0 - smoothstep(0.0, 0.28, dep);
			float foam = shore * smoothstep(0.55, 0.85, fn2 * 0.55 + band * 0.45 + shore * 0.35) * 0.85;
			foam = clamp(foam + rfoam * (0.6 + fn2 * 0.6), 0.0, 1.0);
			float edge = smoothstep(0.0, 0.06, dep);   // thin water fades in rather than ending in a hard line

			float lit = max(uSunDir.y, 0.0) * 0.8 + 0.25;
			vec3 foamCol = (vec3(0.92) * lit + uSunCol * 0.25 * lit + uScat * 0.6);
			vec3 rgb = refl * F + spec * (1.0 - foam);
			float a = F;
			rgb = rgb * (1.0 - foam) + foamCol * foam; a = a * (1.0 - foam) + foam;
			rgb *= edge; a *= edge;

			vec3 fc = skyCol(normalize(vec3(-V.x, 0.0, -V.z) + vec3(0.0, 1e-4, 0.0)));

			gl_FragColor = vec4(rgb, a);

			#include <colorspace_fragment>
		}`,

// the same waves on the CPU, so floating things sit on the surface the GPU is drawing
function waveAt(x, z, t) {
	let h = 0, gx = 0, gz = 0;
	for (const [dx, dz, A0, L] of WATER.waves) {
		const l = Math.hypot(dx, dz), Dx = dx / l, Dz = dz / l, A = A0 * WU.uAmp.value, k = 2 * Math.PI / L, w = Math.sqrt(9.8 * k);

		h += A * Math.sin(ph); gx += A * k * c * Dx; gz += A * k * c * Dz;
	}
	return [h, gx, gz];
}

	}
	const k = 1 - Math.exp(-dt * 12);
	for (const n in HERO.act) { HERO.w[n] += ((t[n] || 0) - HERO.w[n]) * k; HERO.act[n].setEffectiveWeight(HERO.w[n]); }
	if (HERO.act.walk) HERO.act.walk.timeScale = THREE.MathUtils.clamp(s / (HREF.walk * H), 0.5, 1.9);
	if (HERO.act.run) HERO.act.run.timeScale = THREE.MathUtils.clamp(s / (HREF.run * H), 0.7, 1.7);
	HERO.mixer.update(dt);
}

// ---------------------------------------------------------------------------------------------
// Camera: orbits whatever you are driving. Snaps in when something is in the way rather than
// climbing over it, and never goes under the water or the sand.
// ---------------------------------------------------------------------------------------------
const camFocus = new THREE.Vector3();
function stepCam(dt) {
	if (P.mode === 'boat') camFocus.set(BOAT.pos.x, 1.4, BOAT.pos.z);
	else camFocus.set(P.pos.x, P.pos.y + 1.1, P.pos.z);
	if (CAM.first) { CAM.lag.copy(camFocus); CAM.first = false; }
	CAM.lag.lerp(camFocus, 1 - Math.exp(-dt * 7));
	const base = P.mode === 'boat' ? 15 : 8.5, dist = base * CAM.zoom, s = Math.sin(CAM.pol);
	camera.position.set(CAM.lag.x + Math.cos(CAM.az) * s * dist, CAM.lag.y + Math.cos(CAM.pol) * dist, CAM.lag.z + Math.sin(CAM.az) * s * dist);
	const floor = Math.max(0.35, groundAt(camera.position.x, camera.position.z) + 0.45);
	if (camera.position.y < floor) camera.position.y = floor;
	camera.lookAt(CAM.lag);
	sky.position.copy(camera.position);
	// the shadow map follows what you are looking at
	sun.target.position.copy(CAM.lag).setY(0);
	sun.position.copy(U.uSunDir.value).multiplyScalar(60).add(sun.target.position);
}

// ---------------------------------------------------------------------------------------------
// Loop, with dynamic resolution: a phone that cannot hold ~50 fps gives up pixels, not frames.
// ---------------------------------------------------------------------------------------------
const fpsEl = document.getElementById('fps');
let last = performance.now(), acc = 0, frames = 0;
function resize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize);
const hintEl = document.getElementById('hint');

function frame(now) {
	const dt = Math.min(0.05, (now - last) / 1000); last = now;
	U.uTime.value += dt;
	const t = U.uTime.value;

	if (P.mode === 'walk') stepWalk(dt); else stepBoat(dt);
	if (P.mode === 'walk') BOAT.v *= Math.exp(-dt * 0.6);   // a parked boat comes to rest
	stepBoatWake(dt);
	IN.jump = false; IN.act = false;

	const [bh, bgx, bgz] = waveAt(BOAT.pos.x, BOAT.pos.z, t);
	boat.position.set(BOAT.pos.x, bh - 0.12, BOAT.pos.z);
	const fx = Math.sin(BOAT.h), fz = Math.cos(BOAT.h);
	boat.rotation.set(0, 0, 0); boat.rotation.y = BOAT.h;
	boat.rotateX(-(bgx * fx + bgz * fz) * 0.7 - Math.min(0.08, Math.abs(BOAT.v) * 0.012));   // pitch with the slope, bow up under way
	boat.rotateZ((bgx * fz - bgz * fx) * 0.7);
	boat.updateMatrixWorld();
	for (const b of buoys) {
		const [h, gx, gz] = waveAt(b.position.x, b.position.z, t);
		b.position.y = h - 0.15; b.rotation.set(gz * 0.9 + Math.sin(t * 1.3 + b.userData.ph) * 0.05, 0, -gx * 0.9);
	}

	stepHero(dt);
	stepCam(dt);

	// the contextual button says what it will do
	const near = P.mode === 'walk' && P.pos.distanceTo(BOAT.pos) < 3.4;
	const canLeave = P.mode === 'boat' && Math.abs(BOAT.v) < 2.5 && exitPoint();
	actB.style.display = near || canLeave ? 'block' : 'none';
	actB.textContent = near ? 'Board' : 'Go ashore';
	jumpB.style.display = P.mode === 'walk' ? 'block' : 'none';

	renderer.render(scene, camera);

	acc += dt; frames++;
	if (acc > 2) {
		const fps = frames / acc; acc = 0; frames = 0;
		if (fps < 48 && dpr > 1) { dpr = Math.max(1, dpr - 0.25); renderer.setPixelRatio(dpr); resize(); }
		else if (fps > 58 && dpr < DPR_MAX) { dpr = Math.min(DPR_MAX, dpr + 0.25); renderer.setPixelRatio(dpr); resize(); }
		fpsEl.textContent = Math.round(fps) + ' fps · ' + dpr.toFixed(2) + 'x' + (P.mode === 'boat' ? ' · ' + Math.abs(BOAT.v).toFixed(1) + ' m/s' : '');
	}
	requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => hintEl.classList.add('gone'), 7000);

// ---------------------------------------------------------------------------------------------
// New build? Pages caches index.html, so the running copy says when the server has moved on.
// ---------------------------------------------------------------------------------------------
const pill = document.getElementById('pill');
pill.addEventListener('click', () => location.reload());
setInterval(async () => {
	try {
		const v = await (await fetch('version.json?' + Date.now(), { cache: 'no-store' })).json();
		if (v.build > BUILD) { pill.textContent = 'build w' + v.build + ' ready · tap'; pill.style.display = 'block'; }
	} catch { }
}, 15000);

window.water = { IN, THREE, scene, camera, renderer, WATER, SEA, TIMES, U, WU, CAM, BOAT, P, MOVE, HERO, addRipple, setTime, setSea, height, heroLook, board, leave };
</script>
</body>
</html>
